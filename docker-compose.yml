version: '3.9'

services:
  # Aplicação Next.js - Frontend Principal
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmic-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://cosmic_user:cosmic_dev_password@postgres:5432/cosmic_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lunar-compute:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cosmic-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Microserviço Python - Cálculos Astronômicos
  lunar-compute:
    build:
      context: ./services/lunar-compute
      dockerfile: Dockerfile
    container_name: cosmic-lunar-compute
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      - ./services/lunar-compute/main.py:/app/main.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cosmic-network

  # PostgreSQL - Banco de Dados
  postgres:
    image: postgres:16-alpine
    container_name: cosmic-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cosmic_db}
      POSTGRES_USER: ${POSTGRES_USER:-cosmic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosmic_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cosmic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cosmic_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache em Tempo Real
  redis:
    image: redis:7-alpine
    container_name: cosmic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - cosmic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cosmic-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
